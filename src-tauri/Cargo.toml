[package]
name = "conclave"
version = "0.2.0"
description = "Conclave — multi-agent terminal + AI chat workspace for macOS"
edition = "2021"
rust-version = "1.77"
# Two bin targets exist (the GUI app `conclave` + the `conclave-cli` client),
# so `cargo run` / `tauri dev` would otherwise be ambiguous. The GUI is the
# default; build the CLI explicitly with `cargo build --bin conclave-cli`.
default-run = "conclave"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "conclave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "net", "io-util", "time"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
chain-builder = { version = "3", default-features = false, features = ["sqlx_sqlite"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
dirs = "6"
portable-pty = "0.9.0"
futures-util = "0.3.32"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
keyring = { version = "3", features = ["apple-native"] }

