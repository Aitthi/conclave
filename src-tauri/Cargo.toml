[package]
name = "conclave"
version = "0.2.0"
license = "MIT"
description = "Conclave — multi-agent terminal + AI chat workspace for macOS"
edition = "2021"
rust-version = "1.88"
# Two bin targets exist (the GUI app `conclave` + the `conclave-cli` client),
# so `cargo run` / `tauri dev` would otherwise be ambiguous. The GUI is the
# default; build the CLI explicitly with `cargo build --bin conclave-cli`.
default-run = "conclave"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "conclave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "net", "io-util", "time", "process"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
chain-builder = { version = "3", default-features = false, features = ["sqlx_sqlite"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
# IANA timezone database. `iana-time-zone` (already present transitively via
# chrono's "clock" feature) only DETECTS the local zone name; it carries no tz
# database and cannot resolve an arbitrary zone or its DST transitions, which
# the Overview's local calendar buckets require.
chrono-tz = "0.10"
dirs = "6"
portable-pty = "0.9.0"
futures-util = "0.3.32"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
keyring = { version = "3", features = ["apple-native"] }
sha2 = "0.10"
unicode-normalization = "0.1"
# Default features disabled: `hf-hub-native-tls`/`ort-download-binaries-native-tls`
# pull in a second TLS stack (OpenSSL) alongside the rustls-tls `reqwest` already
# uses above; `image-models` is unused (text embedding only, v1 uses MiniLM only).
fastembed = { version = "5.17", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
codeintel = { path = "crates/codeintel" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-web-kit = { version = "0.3.2", features = ["WKWebView", "WKSnapshotConfiguration", "block2"] }
objc2-app-kit = { version = "0.3.2", features = ["NSImage", "NSBitmapImageRep", "NSGraphics"] }
block2 = "0.6"

[workspace]
members = ["crates/codeintel"]

[dev-dependencies]
