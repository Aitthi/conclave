[package]
name = "codeintel"
description = "Code intelligence core for Conclave: survey, cross-reference, and AST-edit a codebase."
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ignore = "0.4"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
rayon = "1"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
ast-grep-core = "=0.38.7"
ast-grep-config = "=0.38.7"
ast-grep-language = "=0.38.7"

[dev-dependencies]
tempfile = "3"
