<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arta</title>
    <!-- Font <link>s (Geist, Instrument Serif, Fraunces, Space Grotesk, Noto Sans/Serif
         Thai) are injected by protoApp()'s transformIndexHtml hook (vite/proto-app.ts),
         from the single FONT_LINK constant (src/lib/prototype.ts) — not hand-copied here. -->
  </head>
  <body>
    <div id="root"></div>
    <!-- Relative (not root-absolute) so this resolves correctly both in `vite dev`
         (root = pkgRoot, page URL is /proto/index.html — same resolved URL either way)
         and in the static export build (root = pkgRoot/proto, so the built HTML lands
         at <outDir>/index.html instead of nested under <outDir>/proto/). -->
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
